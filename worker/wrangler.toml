# GRIDLOCK live-score relay. See worker/README.md.
name = "gridlock-live"
main = "src/index.js"
compatibility_date = "2026-09-01"

# One global instance holds the latest scores in memory, so MFL sees at most
# one request per CACHE_SECONDS however many people have the app open.
[[durable_objects.bindings]]
name = "LIVE"
class_name = "LiveScores"

# The write relay (src/relay.js): one instance, so writes are sent one at a
# time and the audit log and login checks live in its SQLite storage.
[[durable_objects.bindings]]
name = "RELAY"
class_name = "WriteRelay"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveScores"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["WriteRelay"]

# Daily check that each owner's MFL login still works, to learn how long one lasts
# (keep in step with DAILY_CRON in src/index.js), and the push alert checks
# every 15 minutes.
[triggers]
crons = ["23 14 * * *", "*/15 * * * *"]

# Secrets, never here: COOKIE_KEY, the key that encrypts each owner's
# stored MFL login. The Deploy live relay workflow creates it on first deploy
# (a random 32 bytes nobody needs to see); and RECAP_KEY, which lets the weekly
# recap task save recaps, copied from the GitHub secret of that name. See README.md.

[vars]
MFL_HOST = "https://www44.myfantasyleague.com"
MFL_LEAGUE_ID = "63396"
MFL_SEASON = "2025"
CACHE_SECONDS = "90"
# The site (Cloudflare Pages). Its origin is always allowed; ALLOWED_ORIGINS
# adds others (the old GitHub Pages address, local development).
SITE_URL = "https://kevin-dynasty-app.pages.dev"
ALLOWED_ORIGINS = "https://pimpanzee.github.io,http://localhost:3000"
# Set to the User-Agent MFL gives the app when it is registered (README).
MFL_USER_AGENT = "gridlock/1.0"
# The weekly recap's voice: roast, playful, straight, or any description (src/writer.js).
RECAP_TONE = "roast"
